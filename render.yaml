services:
  - type: web
    name: iskra-ai
    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      gunicorn app:app --workers 2 --threads 4 --timeout 120

    envVars:

      - key: PYTHON_VERSION
        value: 3.11.9

      # =========================
      # ROUTER
      # =========================

      - key: LLM_PROVIDER
        value: openai

      - key: LLM_FALLBACK_PROVIDERS
        value: gemini,deepseek

      # Pętla badawcza nie może startować osobno w każdym workerze Gunicorn.
      - key: ENABLE_AUTONOMOUS_LOOP
        value: false

      # =========================
      # OPENAI
      # =========================

      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # API KEY ustaw ręcznie w panelu Render

      # =========================
      # GEMINI
      # =========================

      # Model i klucz ustaw w panelu Render. Pusty model wyłącza ten fallback.
      - key: GEMINI_MODEL
        value: ""

      # API KEY ustaw ręcznie w panelu Render (GEMINI_API_KEY).

    healthCheckPath: /health

    autoDeploy: true
