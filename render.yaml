services:
  - type: web
    name: iskra-ai
    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      gunicorn wsgi:app --workers 2 --threads 4 --timeout 120

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Configure a strong secret in Render; never commit its value.
      - key: API_TOKEN
        sync: false

      - key: LLM_PROVIDER
        value: openai

      - key: LLM_FALLBACK_PROVIDERS
        value: gemini,deepseek

      - key: ENABLE_AUTONOMOUS_LOOP
        value: false

      - key: OPENAI_MODEL
        value: gpt-4o-mini

      - key: GEMINI_MODEL
        value: ""

    healthCheckPath: /health
    autoDeploy: true
