services:
  - type: web
    name: iskra-ai
    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    # WSGI wrapper enforces API_TOKEN before the dashboard/API are exposed.
    startCommand: |
      gunicorn wsgi:app --workers 2 --threads 4 --timeout 120

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Fail-closed authentication: create a long random secret in Render.
      # Do not commit the real value to this file or repository.
      - key: API_TOKEN
        sync: false

      - key: LLM_PROVIDER
        value: openai

      - key: LLM_FALLBACK_PROVIDERS
        value: gemini,deepseek

      - key: ENABLE_AUTONOMOUS_LOOP
        value: false

      # For multi-worker production, set RATELIMIT_STORAGE_URI to shared Redis.
      # If omitted, the in-memory limiter is local to each worker.

      # Semantic retrieval is opt-in and uses OPENAI_API_KEY when enabled.
      - key: ENABLE_SEMANTIC_SEARCH
        value: false

      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small

      - key: OPENAI_MODEL
        value: gpt-4o-mini

      - key: GEMINI_MODEL
        value: ""

    healthCheckPath: /health
    autoDeploy: true
