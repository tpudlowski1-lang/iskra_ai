services:
  - type: web
    name: iskra-ai
    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      gunicorn wsgi:app --workers 1 --threads 4 --timeout 120

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Configure a strong secret in Render; never commit its value.
      - key: API_TOKEN
        sync: false

      - key: LLM_PROVIDER
        value: openai

      - key: LLM_FALLBACK_PROVIDERS
        value: deepseek

      # Provider allowlist is deny-by-default in the runtime router.
      - key: LLM_ALLOWED_PROVIDERS
        value: ""
      # Per-tenant approval is separately deny-by-default; configure only after review.
      - key: ISKRA_TENANT_PROVIDER_ALLOWLIST_JSON
        value: "{}"
      - key: ISKRA_ENABLE_DOCUMENT_INGESTION
        value: "false"

      # Add secret values in the Render dashboard; never commit API keys.
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

      - key: ISKRA_RATE_LIMIT_ENABLED
        value: true

      - key: ENABLE_AUTONOMOUS_LOOP
        value: false

      - key: OPENAI_MODEL
        value: gpt-4o-mini


    healthCheckPath: /health
    autoDeploy: false
