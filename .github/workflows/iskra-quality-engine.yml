name: Iskra Quality Engine v1
on:
  push:
    branches: [quality/engine-v1]
  pull_request:
    branches: [refactor/modular-core, integration/full-release-candidate-v1, feature/tenant-chat-ui-v1, privacy/tenant-provider-policy-v1, privacy/outbound-prompt-minimization-v1, feature/tenant-account-lifecycle-v1, feature/tenant-admin-console-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-quality-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile quality engine and tests
        run: python -m compileall -q iskra/quality tests/test_quality_engine.py
      - name: Run deterministic quality engine tests
        run: python -m unittest discover -s tests -p "test_quality_engine.py" -v
