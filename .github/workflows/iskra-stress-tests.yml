name: Iskra multithread stress tests

on:
  pull_request:
    branches: [commercial-mvp, refactor/modular-core]
  push:
    branches: [iskra-multithread-stress, refactor/modular-core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENABLE_AUTONOMOUS_LOOP: "false"
      LLM_PROVIDER: deepseek
      LLM_FALLBACK_PROVIDERS: openai,gemini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run multithread stress tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
