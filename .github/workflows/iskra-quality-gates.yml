name: Iskra unified quality gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [iskra-unified-core, refactor/modular-core, security/credential-store-v2, security/wsgi-auth-integration-v1, integration/full-release-candidate-v1, feature/tenant-chat-ui-v1, privacy/tenant-provider-policy-v1, privacy/outbound-prompt-minimization-v1, feature/tenant-account-lifecycle-v1, feature/tenant-admin-console-v1]
  push:
    branches: [refactor/modular-core, storage/postgresql-tenant]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test-suite:
    name: Full test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iskra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iskra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ISKRA_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/iskra_test
      ISKRA_TEST_POSTGRES_APP_DSN: postgresql://iskra_app_test:iskra_test_password@localhost:5432/iskra_test
      ENABLE_AUTONOMOUS_LOOP: "false"
      ISKRA_TESTING: "true"
      ISKRA_RATE_LIMIT_ENABLED: "false"
      LLM_PROVIDER: deepseek
      LLM_FALLBACK_PROVIDERS: openai,gemini
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate browser assistant JavaScript syntax
        run: node --check static/assistant.js
      - name: Exercise browser assistant session race guards
        run: node tests/test_assistant_session_race.js
      - name: Compile all application and test modules
        run: python -m compileall -q app.py wsgi.py security.py iskra tests
      - name: Validate adversarial corpus independently
        run: python -m unittest discover -s tests -p "test_redteam_corpus.py" -v
      - name: Run complete unit, API, security, storage and concurrency suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit pinned runtime dependencies
        run: pip-audit -r requirements.txt
