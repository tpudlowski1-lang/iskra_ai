name: Iskra unified quality gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [iskra-unified-core, refactor/modular-core, security/request-principal, security/credential-registry, security/credential-middleware, security/credential-store-hardening]
  push:
    branches: [refactor/modular-core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test-suite:
    name: Full test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      ENABLE_AUTONOMOUS_LOOP: "false"
      LLM_PROVIDER: deepseek
      LLM_FALLBACK_PROVIDERS: openai,gemini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all application and test modules
        run: python -m compileall -q app.py wsgi.py security.py iskra tests
      - name: Run complete unit, API, security, storage and concurrency suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit pinned runtime dependencies
        run: pip-audit -r requirements.txt
